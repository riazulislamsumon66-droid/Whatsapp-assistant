name: Build Maya APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install packages
      run: |
        pip install -r requirements.txt
        flutter --version 2>/dev/null || echo "Flutter will be installed by flet"

    - name: Build APK
      run: |
        echo "y" | flet build apk \
          --output maya.apk \
          --product "Maya Assistant" \
          --org com.maya.assistant \
          2>&1 | tail -80

    - name: Show result
      if: always()
      run: |
        echo "=== APK search ==="
        find /home -name "*.apk" 2>/dev/null
        find /tmp -name "*.apk" 2>/dev/null
        ls -la maya.apk 2>/dev/null || echo "No maya.apk in cwd"
        ls -la *.apk 2>/dev/null || echo "No apk in cwd"

    - name: Upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: MayaAssistant.apk
        path: maya.apk
        retention-days: 7
