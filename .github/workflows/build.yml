name: Build Maya APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential ccache git \
          libffi-dev libssl-dev \
          openjdk-17-jdk \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev \
          cmake swig unzip zip \
          libsqlite3-dev \
          wget curl xz-utils \
          libgdbm-dev libnss3-dev \
          libreadline-dev

    - name: Cache buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: bz-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: bz-${{ runner.os }}-

    - name: Install buildozer
      run: |
        pip install --upgrade pip
        pip install cython buildozer

    - name: Build debug APK
      run: |
        buildozer -v android debug 2>&1 | tail -100

    - name: Show build result
      if: always()
      run: |
        echo "=== bin/ ==="
        ls -la bin/ 2>/dev/null || echo "No bin dir"
        find . -name "*.apk" -type f 2>/dev/null

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: MayaAssistant.apk
        path: bin/*.apk
        retention-days: 7
