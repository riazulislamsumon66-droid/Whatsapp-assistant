name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af6c3

    - name: Set up Python 3.10
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.10'

    - name: Install system deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential ccache git \
          libffi-dev libssl-dev \
          openjdk-17-jdk \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake \
          libsqlite3-dev \
          wget curl unzip zip swig \
          libgdbm-dev \
          libnss3-dev \
          libreadline-dev \
          xz-utils

    - name: Cache .buildozer
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: |
          ~/.buildozer
        key: bz-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: bz-${{ runner.os }}-

    - name: Upgrade pip + install buildozer
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install cython buildozer

    - name: Init buildozer (accept licenses + download SDK/NDK)
      run: |
        yes | buildozer android update 2>&1 || true

    - name: Build debug APK
      run: |
        set +e
        buildozer -v android debug 2>&1 | tee build.log
        echo "EXIT_CODE=$?" >> $GITHUB_ENV
        set -e

    - name: Show last 100 lines of build
      if: always()
      run: tail -100 build.log

    - name: Find APK
      id: find_apk
      run: |
        APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
        echo "APK found: $APK"
        if [ -n "$APK" ]; then
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"
        else
          echo "No APK found!"
          find . -name "*.apk" 2>/dev/null
        fi

    - name: Upload APK
      if: steps.find_apk.outputs.apk_path != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa0e
      with:
        name: MayaWhatsAppAssistant.apk
        path: ${{ steps.find_apk.outputs.apk_path }}
        retention-days: 14
