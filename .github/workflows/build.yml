name: Build Maya APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Flet
      run: pip install flet

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.0'
        channel: 'stable'

    - name: Build APK with Flet
      run: |
        flutter doctor -v
        flet build apk \
          --output maya-assistant.apk \
          --product "Maya Assistant" \
          --org com.maya.assistant \
          2>&1 | tail -80

    - name: Check APK
      run: |
        ls -lh maya-assistant.apk 2>/dev/null || echo "Not in root"
        find . -name "*.apk" -type f 2>/dev/null

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MayaAssistant.apk
        path: maya-assistant.apk
        retention-days: 14
        if-no-files-found: warn
