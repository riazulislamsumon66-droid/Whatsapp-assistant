name: Build Maya APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK for Buildozer
      run: |
        set -e
        SDK=/home/runner/.buildozer/android/platform/android-sdk
        mkdir -p $SDK

        # Download cmdline-tools
        mkdir -p $SDK/cmdline-tools/latest
        cd /tmp
        wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O tools.zip
        unzip -q tools.zip
        cp -r cmdline-tools/* $SDK/cmdline-tools/latest/
        rm -rf cmdline-tools tools.zip

        # Create 'tools' symlink that p4a expects (points to cmdline-tools/latest)
        ln -sfn $SDK/cmdline-tools/latest $SDK/tools

        # Accept licenses and install
        export ANDROID_HOME=$SDK
        yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
        $SDK/cmdline-tools/latest/bin/sdkmanager --install \
          "platforms;android-34" \
          "platforms;android-33" \
          "build-tools;34.0.0" \
          "build-tools;33.0.2" \
          "platform-tools"

        echo "=== SDK structure ==="
        ls $SDK/
        ls $SDK/build-tools/
        ls $SDK/platforms/
        echo "aidl:"
        find $SDK -name "aidl" 2>/dev/null || echo "no aidl binary"

    - name: Install Buildozer + Dependencies
      run: |
        pip install --upgrade pip
        pip install cython==0.29.36 buildozer==1.5.0
        pip install kivy==2.3.0 requests pillow

    - name: Build APK with Buildozer
      run: |
        export ANDROID_HOME=/home/runner/.buildozer/android/platform/android-sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        export PATH="$ANDROID_HOME/build-tools/34.0.0:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

        buildozer -v android debug 2>&1

    - name: Find APK
      if: always()
      run: |
        echo "=== APK files ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK"

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Maya-Assistant-APK
        path: bin/*.apk
        retention-days: 30
