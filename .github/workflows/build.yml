name: Build Maya APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      FLUTTER_VERSION: "3.27.1"
      JAVA_VERSION: "17"

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Android SDK
      uses: actions/cache@v4
      with:
        path: /home/runner/android-sdk
        key: android-sdk-34-v1

    - name: Install Android SDK
      run: |
        export ANDROID_HOME=/home/runner/android-sdk
        if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          cd /tmp
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O tools.zip
          unzip -q tools.zip
          cp -r cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          rm -rf cmdline-tools tools.zip
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"
        else
          echo "Android SDK cached!"
        fi

    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.1'

    - name: Configure Flutter for Android
      run: |
        export ANDROID_HOME=/home/runner/android-sdk
        flutter config --android-sdk $ANDROID_HOME
        flutter doctor --android-licenses || true
        flutter version
        dart --version

    - name: Install Flet CLI
      run: |
        pip install flet-cli>=0.25.0 requests pillow

    - name: Build APK with Flet
      run: |
        export ANDROID_HOME=/home/runner/android-sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        
        flet build apk \
          --product "Maya Assistant" \
          --org com.maya.assistant \
          --description "Maya WhatsApp Assistant" \
          --android-permissions "android.permission.INTERNET=true" \
          --android-permissions "android.permission.ACCESS_NETWORK_STATE=true" \
          --android-permissions "android.permission.FOREGROUND_SERVICE=true" \
          --android-permissions "android.permission.WAKE_LOCK=true"

    - name: Find APK
      if: always()
      run: |
        echo "=== Looking for APK ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Maya-Assistant-APK
        path: |
          build/flutter/**/*.apk
          build/app/outputs/**/*.apk
          build/**/*.apk
        retention-days: 30
