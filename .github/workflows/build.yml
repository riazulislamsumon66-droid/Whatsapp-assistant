name: Build Maya APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK + NDK
      run: |
        export ANDROID_HOME=/home/runner/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        cd /tmp
        wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O tools.zip
        unzip -q tools.zip
        cp -r cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
        rm -rf cmdline-tools tools.zip
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
          "platforms;android-34" \
          "platforms;android-33" \
          "build-tools;34.0.0" \
          "build-tools;33.0.2" \
          "platform-tools" \
          --no_https --proxy=http --proxy_host=0.0.0.0 --proxy_port=0 2>/dev/null || \
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
          "platforms;android-34" \
          "platforms;android-33" \
          "build-tools;34.0.0" \
          "build-tools;33.0.2" \
          "platform-tools"
        echo "SDK installed!"
        ls $ANDROID_HOME/platforms/
        ls $ANDROID_HOME/build-tools/

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install cython==0.29.36 buildozer==1.5.0
        pip install kivy==2.3.0 requests pillow

    - name: Build APK
      run: |
        export ANDROID_HOME=/home/runner/android-sdk
        export ANDROID_SDK_ROOT=/home/runner/android-sdk
        export PATH="$ANDROID_HOME/build-tools/34.0.0:$ANDROID_HOME/platform-tools:$PATH"

        # Create the symlink buildozer expects
        mkdir -p /home/runner/.buildozer/android/platform/
        ln -sfn /home/runner/android-sdk /home/runner/.buildozer/android/platform/android-sdk

        echo "Symlinks:"
        ls -la /home/runner/.buildozer/android/platform/

        echo "aidl location:"
        find /home/runner/android-sdk -name "aidl" -type f 2>/dev/null || echo "No aidl found"

        buildozer -v android debug 2>&1

    - name: Find APK
      if: always()
      run: |
        echo "=== APK files ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Maya-Assistant-APK
        path: bin/*.apk
        retention-days: 30
