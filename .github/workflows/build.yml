name: Build Maya APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /home/runner/android-sdk
      # নতুন Flet 0.85.2 এর রিকোয়ারমেন্ট অনুযায়ী ফ্ল্যাটার ভার্সন আপডেট করা হলো
      FLUTTER_VERSION: "3.41.7"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Flutter SDK
      id: cache-flutter
      uses: actions/cache@v4
      with:
        path: /home/runner/flutter
        key: flutter-${{ env.FLUTTER_VERSION }}

    - name: Download and install Flutter
      run: |
        if [ ! -f "/home/runner/flutter/bin/flutter" ]; then
          echo "Downloading Flutter ${{ env.FLUTTER_VERSION }}..."
          cd /tmp
          # লেটেস্ট ফ্ল্যাটার আর্ক্রাইভ ইউআরএল
          wget -q "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz" -O flutter.tar.xz
          cd /home/runner
          mkdir -p /home/runner/flutter
          tar xf /tmp/flutter.tar.xz -C /home/runner/
          rm /tmp/flutter.tar.xz
          echo "Flutter installed!"
        else
          echo "Flutter cached!"
        fi

    - name: Add Flutter to PATH
      run: |
        echo "/home/runner/flutter/bin" >> $GITHUB_PATH
        echo "/home/runner/flutter/bin/cache/dart-sdk/bin" >> $GITHUB_PATH

    - name: Cache Android SDK
      id: cache-android
      uses: actions/cache@v4
      with:
        path: /home/runner/android-sdk
        key: android-sdk-34-v2

    - name: Setup Android SDK
      run: |
        if [ ! -d "/home/runner/android-sdk/platforms/android-34" ] || [ ! -f "/home/runner/android-sdk/platform-tools/adb" ]; then
          echo "Setting up Android SDK with Platform Tools..."
          mkdir -p /home/runner/android-sdk/cmdline-tools/latest
          
          cd /tmp
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O tools.zip
          unzip -q tools.zip
          
          cp -r cmdline-tools/* /home/runner/android-sdk/cmdline-tools/latest/
          rm -rf cmdline-tools tools.zip
          
          export PATH="/home/runner/android-sdk/cmdline-tools/latest/bin:$PATH"
          yes | /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # platform-tools এবং প্রয়োজনীয় SDK বিল্ড টুলস ইন্সটল
          /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
        else
          echo "Android SDK and Platform Tools cached!"
        fi

    - name: Install Flet
      run: pip install --upgrade flet requests

    - name: Configure Flutter and Android SDK
      run: |
        export ANDROID_HOME=/home/runner/android-sdk
        export ANDROID_SDK_ROOT=/home/runner/android-sdk
        export PATH="/home/runner/flutter/bin:/home/runner/android-sdk/platform-tools:/home/runner/android-sdk/cmdline-tools/latest/bin:$PATH"
        flutter config --android-sdk /home/runner/android-sdk
        flutter doctor

    - name: Build APK with Flet
      run: |
        export ANDROID_HOME=/home/runner/android-sdk
        export ANDROID_SDK_ROOT=/home/runner/android-sdk
        export PATH="/home/runner/flutter/bin:/home/runner/android-sdk/platform-tools:/home/runner/android-sdk/cmdline-tools/latest/bin:$PATH"
        
        # গ্র্যাডল এনভায়রনমেন্টে অ্যান্ড্রয়েড SDK ভার্সন পুশ করা
        export CLOUDSDK_ANDROID_COMPILER_VERSION=34
        export CLOUDSDK_ANDROID_TARGET_VERSION=34
        
        # Flet বিল্ড কনফিগারেশন ফাইল তৈরি (wakelock_plus এবং অন্যান্য প্লাগইনের SDK এরর ফিক্স করার জন্য)
        cat <<EOF > flet-build.toml
        [android]
        compile_sdk_version = 34
        target_sdk_version = 34
        min_sdk_version = 21
        EOF
        
        # Flet বিল্ড কমান্ড রান করা (yes পাইপ করার মাধ্যমে যেকোনো অটো-প্রম্পট কনফার্ম করা হলো)
        yes y | flet build apk --product "Maya Assistant" --org com.maya.assistant

    - name: Find and list APK
      if: always()
      run: |
        echo "=== All APK files in workspace ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK found anywhere"
        echo "=== Common Flet paths ==="
        ls -la build/apk/ 2>/dev/null || echo "build/apk not found"
        ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "flutter-apk dir not found"
        ls -la build/ 2>/dev/null || echo "build dir not found"

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Maya-Assistant-APK
        path: |
          build/apk/*.apk
          build/app/outputs/flutter-apk/*.apk
          build/**/*.apk
        retention-days: 30
        
