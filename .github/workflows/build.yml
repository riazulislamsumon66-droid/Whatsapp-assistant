name: Build Maya APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Android SDK
      id: cache-android
      uses: actions/cache@v4
      with:
        path: /home/runner/android-sdk
        key: android-sdk-34-v2

    - name: Setup Android SDK
      run: |
        if [ ! -d "/home/runner/android-sdk/platforms/android-34" ]; then
          echo "Setting up Android SDK 34..."
          mkdir -p /home/runner/android-sdk/cmdline-tools/latest
          cd /tmp
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O tools.zip
          unzip -q tools.zip
          cp -r cmdline-tools/* /home/runner/android-sdk/cmdline-tools/latest/
          rm -rf cmdline-tools tools.zip
          yes | /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"
        else
          echo "Android SDK 34 cached!"
        fi

    - name: Install Buildozer and Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install \
          buildozer==1.5.0 \
          kivy==2.3.0 \
          requests \
          pillow \
          cython==0.29.36

    - name: Cache Gradle and Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          ~/.gradle
        key: buildozer-gradle-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-gradle-${{ runner.os }}-

    - name: Configure Android SDK for Buildozer
      run: |
        set -e
        yes | /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
        cp /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager /usr/local/bin/ 2>/dev/null || true

    - name: Build APK with Buildozer
      run: |
        export ANDROID_HOME=/home/runner/android-sdk
        export ANDROID_SDK_ROOT=/home/runner/android-sdk
        export PATH="/home/runner/android-sdk/platform-tools:/home/runner/android-sdk/cmdline-tools/latest/bin:$PATH"

        # Accept licenses
        yes | sdkmanager --licenses > /dev/null 2>&1 || true

        # Debug build - no signing needed
        buildozer -v android debug 2>&1 | tail -80

    - name: Find and list APK
      if: always()
      run: |
        echo "=== APK files ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
        ls -la bin/ 2>/dev/null || echo "bin/ not found"

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Maya-Assistant-APK
        path: bin/*.apk
        retention-days: 30
