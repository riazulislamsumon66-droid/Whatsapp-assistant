name: Build Maya APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /opt/android-sdk
      FLUTTER_VERSION: "3.24.5"

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache Flutter SDK
      id: cache-flutter
      uses: actions/cache@v4
      with:
        path: /opt/flutter
        key: flutter-${{ env.FLUTTER_VERSION }}

    - name: Download and install Flutter
      run: |
        if [ ! -f "/opt/flutter/bin/flutter" ]; then
          echo "Downloading Flutter ${{ env.FLUTTER_VERSION }}..."
          cd /tmp
          wget -q "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.24.5-stable.tar.xz" -O flutter.tar.xz
          cd /opt
          sudo mkdir -p /opt/flutter
          sudo tar xf /tmp/flutter.tar.xz -C /opt/
          sudo rm /tmp/flutter.tar.xz
          echo "Flutter installed!"
        else
          echo "Flutter cached!"
        fi

    - name: Add Flutter to PATH
      run: |
        echo "/opt/flutter/bin" >> $GITHUB_PATH
        echo "/opt/flutter/bin/cache/dart-sdk/bin" >> $GITHUB_PATH

    - name: Cache Android SDK
      id: cache-android
      uses: actions/cache@v4
      with:
        path: /opt/android-sdk
        key: android-sdk-34

    - name: Setup Android SDK
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      run: |
        if [ ! -d "/opt/android-sdk/platforms/android-34" ]; then
          echo "Setting up Android SDK..."
          sudo mkdir -p /opt/android-sdk/cmdline-tools/latest
          cd /tmp
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O tools.zip
          unzip -q tools.zip
          sudo cp -r cmdline-tools/* /opt/android-sdk/cmdline-tools/latest/
          
          export PATH="/opt/android-sdk/cmdline-tools/latest/bin:$PATH"
          yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
        else
          echo "Android SDK cached!"
        fi

    - name: Install Flet
      run: pip install flet==0.24.1 requests

    - name: Flutter doctor
      run: |
        export ANDROID_HOME=/opt/android-sdk
        export ANDROID_SDK_ROOT=/opt/android-sdk
        export PATH="/opt/flutter/bin:/opt/android-sdk/cmdline-tools/latest/bin:$PATH"
        flutter doctor

    - name: Build APK with Flet
      run: |
        export ANDROID_HOME=/opt/android-sdk
        export ANDROID_SDK_ROOT=/opt/android-sdk
        export PATH="/opt/flutter/bin:/opt/android-sdk/cmdline-tools/latest/bin:$PATH"
        flet build apk --product "Maya Assistant" --org com.maya.assistant

    - name: Find and list APK
      if: always()
      run: |
        echo "=== All APK files in workspace ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK found anywhere"
        echo "=== Common Flet paths ==="
        ls -la build/apk/ 2>/dev/null || echo "build/apk not found"
        ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "flutter-apk dir not found"
        ls -la build/ 2>/dev/null || echo "build dir not found"

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Maya-Assistant-APK
        path: |
          build/apk/*.apk
          build/app/outputs/flutter-apk/*.apk
          build/**/*.apk
        retention-days: 30
        
