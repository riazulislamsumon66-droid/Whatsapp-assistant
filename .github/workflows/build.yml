name: Build Maya APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /opt/android-sdk
      FLUTTER_VERSION: "3.24.5"

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache Flutter SDK
      id: cache-flutter
      uses: actions/cache@v4
      with:
        path: /opt/flutter
        key: flutter-${{ env.FLUTTER_VERSION }}

    - name: Download and install Flutter
      run: |
        if [ ! -f "/opt/flutter/bin/flutter" ]; then
          echo "Downloading Flutter ${{ env.FLUTTER_VERSION }}..."
          cd /tmp
          wget -q "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.24.5-stable.tar.xz" -O flutter.tar.xz
          ls -lh flutter.tar.xz
          cd /opt
          tar xf /tmp/flutter.tar.xz
          rm /tmp/flutter.tar.xz
          echo "Flutter installed!"
        else
          echo "Flutter cached!"
        fi
        /opt/flutter/bin/flutter --version

    - name: Add Flutter to PATH
      run: |
        echo "/opt/flutter/bin" >> $GITHUB_PATH
        echo "/opt/flutter/bin/cache/dart-sdk/bin" >> $GITHUB_PATH

    - name: Cache Android SDK
      id: cache-android
      uses: actions/cache@v4
      with:
        path: /opt/android-sdk
        key: android-sdk-34

    - name: Setup Android SDK
      run: |
        if [ ! -d "/opt/android-sdk/platforms/android-34" ]; then
          echo "Setting up Android SDK..."
          mkdir -p /opt/android-sdk/cmdline-tools
          cd /opt/android-sdk/cmdline-tools
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O tools.zip
          unzip -q tools.zip
          mkdir -p latest
          cp -r cmdline-tools/{bin,lib,NOTICE.txt,source.properties} latest/ 2>/dev/null || true
          export PATH="/opt/android-sdk/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3 || true
        else
          echo "Android SDK cached!"
        fi
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    - name: Install Flet
      run: pip install flet==0.24.1 requests

    - name: Flutter doctor
      run: |
        export ANDROID_HOME=/opt/android-sdk
        export ANDROID_SDK_ROOT=/opt/android-sdk
        flutter doctor 2>&1 | tail -15

    - name: Build APK
      run: |
        export ANDROID_HOME=/opt/android-sdk
        ANDROID_SDK_ROOT=/opt/android-sdk
        echo "y" | flet build apk \
          --output /tmp/maya-assistant.apk \
          --product "Maya Assistant" \
          --org com.maya.assistant \
          2>&1 | tail -80

    - name: Find APK
      if: always()
      run: |
        ls -la /tmp/maya-assistant.apk 2>/dev/null || echo "Not in /tmp"
        find /home -name "*.apk" 2>/dev/null
        find /opt -name "*.apk" 2>/dev/null

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: MayaAssistant.apk
        path: /tmp/maya-assistant.apk
        retention-days: 7
