name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          openjdk-17-jdk \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo6 \
          cmake \
          libgdbm-dev \
          libnss3-dev \
          libreadline-dev \
          libsqlite3-dev \
          wget \
          curl \
          xz-utils \
          tk-dev \
          unzip \
          zip \
          swig
    
    - name: Cache buildozer
      uses: actions/cache@v4
      with:
        path: |
          .buildozer
          ~/.buildozer
        key: buildozer-${{ hashFiles('buildozer.spec') }}
    
    - name: Install buildozer
      run: |
        pip3 install --upgrade pip
        pip3 install --upgrade cython buildozer
    
    - name: Accept Android SDK licenses
      run: |
        yes | buildozer android update || true
    
    - name: Build APK (debug)
      timeout-minutes: 60
      run: |
        buildozer android debug 2>&1 | tail -100
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: whatsapp-assistant-apk
        path: bin/*.apk
        retention-days: 30
