name: Build Maya APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      BUILDOZER_ALLOW_ANY_SDK: 1

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Android SDK
      id: cache-android
      uses: actions/cache@v4
      with:
        path: /home/runner/android-sdk
        key: android-sdk-34-v3

    - name: Setup Android SDK 34
      run: |
        export ANDROID_HOME=/home/runner/android-sdk
        export ANDROID_SDK_ROOT=/home/runner/android-sdk

        if [ ! -d "$ANDROID_HOME/platforms/android-34" ] || [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
          echo "Setting up Android SDK 34..."
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          cd /tmp
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O tools.zip
          unzip -q tools.zip
          cp -r cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          rm -rf cmdline-tools tools.zip
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;25.2.9519653"
        else
          echo "Android SDK 34 cached and ready!"
        fi

        # Verify
        ls -la $ANDROID_HOME/platforms/
        ls -la $ANDROID_HOME/build-tools/

    - name: Install Cython + Buildozer
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install cython==0.29.36
        pip install buildozer==1.5.0
        pip install kivy==2.3.0 requests pillow

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: /home/runner/.buildozer
        key: buildozer-global-${{ runner.os }}-v2
        restore-keys: |
          buildozer-global-${{ runner.os }}-

    - name: Build APK with Buildozer
      run: |
        set -e
        export ANDROID_HOME=/home/runner/android-sdk
        export ANDROID_SDK_ROOT=/home/runner/android-sdk
        export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/build-tools/34.0.0:$PATH"

        # Accept licenses silently
        yes | sdkmanager --licenses > /dev/null 2>&1 || true

        echo "=== Android SDK structure ==="
        ls $ANDROID_HOME/
        ls $ANDROID_HOME/build-tools/
        ls $ANDROID_HOME/platforms/

        echo "=== Starting buildozer ==="
        # Use buildozer with explicit SDK path
        buildozer -v android debug 2>&1

    - name: Find and list APK
      if: always()
      run: |
        echo "=== APK files ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
        ls -la bin/ 2>/dev/null || echo "bin/ empty or not found"

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Maya-Assistant-APK
        path: bin/*.apk
        retention-days: 30
