name: Build Maya APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.0'
        channel: 'stable'

    - name: Print Flutter info
      run: flutter doctor -v

    - name: Build APK with Flet
      run: |
        flet build apk \
          --output maya-assistant.apk \
          --product "Maya Assistant" \
          --org com.maya.assistant \
          2>&1 | tail -100

    - name: Check APK exists
      run: |
        ls -lh maya-assistant.apk 2>/dev/null || echo "Not in root, searching..."
        find . -name "*.apk" -type f 2>/dev/null

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: MayaAssistant.apk
        path: maya-assistant.apk
        retention-days: 14
        if-no-files-found: warn
